# Every push and pull request: unit tests, screenshot tests, and a debug APK to try.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # A tampered gradle-wrapper.jar would run with this repository's permissions.
      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # verifyRoborazziDebug runs every unit test, and fails if a screen no longer
      # matches its committed screenshot in app/src/test/screenshots/.
      - name: Unit and screenshot tests
        run: ./gradlew :app:verifyRoborazziDebug

      - name: Debug build
        run: ./gradlew :app:assembleDebug

      # When a screen changed, these show what changed: the old image, the new one, and a diff.
      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-diffs
          path: app/build/outputs/roborazzi/
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: htpcguides-iptv-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
