# Push a tag like v1.2.3 and this publishes a signed APK as a GitHub release.
#
#   git tag v1.2.3 && git push origin v1.2.3
#
# Needs four repository secrets (Settings → Secrets and variables → Actions):
# RELEASE_KEYSTORE_BASE64, RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write   # to create the release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # release notes are built from the commits since the last tag

      - name: Read the version from the tag
        id: version
        run: |
          ver="${GITHUB_REF_NAME#v}"
          if [[ ! "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH (for example v1.2.3)"
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      # Fail in the first minute, saying what's missing, not after a 10-minute build.
      - name: Check the signing secrets are set
        run: |
          missing=0
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::Repository secret $name is not set (README → Releasing)"; missing=1; fi
          done
          exit $missing

      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit and screenshot tests
        run: ./gradlew :app:verifyRoborazziDebug

      - name: Build the signed release APK
        run: |
          keystore="$RUNNER_TEMP/release.jks"
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          RELEASE_KEYSTORE_PATH="$keystore" ./gradlew :app:assembleRelease -PreleaseVersion=${{ steps.version.outputs.version }}
          rm -f "$keystore"

      - name: Verify the signature and package the release
        id: package
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          "$build_tools/apksigner" verify --print-certs "$apk" > signature.txt
          cert=$(grep -m1 "certificate SHA-256 digest" signature.txt | awk '{print $NF}')
          [ -n "$cert" ] || { echo "::error::The APK is not signed"; exit 1; }
          echo "cert=$cert" >> "$GITHUB_OUTPUT"
          mkdir dist
          cp "$apk" "dist/htpcguides-iptv-${{ steps.version.outputs.version }}.apk"
          # A fixed name too, so .../releases/latest/download/htpcguides-iptv.apk always
          # fetches the newest build — the address to type into a TV's Downloader app.
          cp "$apk" dist/htpcguides-iptv.apk
          (cd dist && sha256sum ./*.apk > SHA256SUMS.txt)

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          CERT: ${{ steps.package.outputs.cert }}
        run: |
          latest="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/htpcguides-iptv.apk"
          notes=$(cat <<EOF
          ## Install

          **Phone or tablet:** download \`htpcguides-iptv-${VERSION}.apk\` below on the device and open it. Android asks once to allow installs from your browser.

          **Android TV / Google TV:** install the *Downloader* app from the Play Store, then enter
          \`${latest}\`
          — that address always fetches the newest release.

          **Updating:** later releases install over this one and keep your favourites. A build installed *before* v0.2.0 was signed with a different key, so remove it once first.

          <details><summary>Verify the download</summary>

          Signing certificate SHA-256: \`${CERT}\`
          File checksums are in \`SHA256SUMS.txt\`.
          </details>

          EOF
          )
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "HTPCGuides IPTV ${VERSION}" \
            --notes "$notes" \
            --generate-notes
